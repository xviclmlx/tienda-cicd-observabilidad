name: CI/CD Tienda

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  O2_URL: ${{ secrets.O2_URL }}
  O2_USER: ${{ secrets.O2_USER }}
  O2_PASSWORD: ${{ secrets.O2_PASSWORD }}
  COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

jobs:
  # ---------------- 1. Pruebas del backend (pytest) ----------------
  backend-tests:
    name: Backend · pytest
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.sum.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Ejecutar pytest
        working-directory: backend
        run: python -m pytest -v --junitxml=pytest-report.xml
      - id: sum
        if: always()
        working-directory: backend
        run: |
          if [ -f pytest-report.xml ]; then
            python - <<'EOF' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET
          s = ET.parse("pytest-report.xml").getroot()
          s = s if s.tag == "testsuite" else s[0]
          t, f, e = int(s.get("tests")), int(s.get("failures")), int(s.get("errors"))
          print(f'summary={{"pytest_total":{t},"pytest_failed":{f + e}}}')
          EOF
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: backend/pytest-report.xml

  # ---------------- 2. Pruebas E2E (Playwright, front + back) ----------------
  e2e-tests:
    name: E2E · Playwright
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.sum.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - name: Levantar contenedores (frontend + backend)
        env:
          APP_PORT: "8080"
          OTEL_ENABLED: "false"
          APP_ENV: ci
        run: docker compose up -d --build --wait
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package.json
      - name: Instalar Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Ejecutar Playwright
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
        run: npx playwright test
      - id: sum
        if: always()
        working-directory: e2e
        run: |
          if [ -f results.json ]; then
            echo "summary=$(jq -c '{playwright_passed: .stats.expected, playwright_failed: .stats.unexpected, playwright_flaky: .stats.flaky}' results.json)" >> "$GITHUB_OUTPUT"
          fi
      - name: Logs de contenedores si falla
        if: failure()
        run: docker compose logs --tail 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report

  # ---------------- 3. Registrar resultado de pruebas en OpenObserve ----------------
  report-tests:
    name: Registrar pruebas en OpenObserve
    runs-on: ubuntu-latest
    needs: [backend-tests, e2e-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Enviar evento de pruebas
        run: |
          BACK='${{ needs.backend-tests.outputs.summary }}'
          E2E='${{ needs.e2e-tests.outputs.summary }}'
          [ -n "$BACK" ] || BACK='{}'
          [ -n "$E2E" ] || E2E='{}'
          jq -n --argjson b "$BACK" --argjson e "$E2E" \
             --arg back "${{ needs.backend-tests.result }}" --arg e2e "${{ needs.e2e-tests.result }}" \
             '$b + $e + {backend_result:$back, e2e_result:$e2e}' > extra.json
          if [ "${{ needs.backend-tests.result }}" = "success" ] && [ "${{ needs.e2e-tests.result }}" = "success" ]; then
            bash scripts/o2-event.sh tests success "Suite completa aprobada" extra.json
          else
            bash scripts/o2-event.sh tests failure "Fallaron las pruebas" extra.json
            if [ "${{ github.event_name }}" = "push" ]; then
              bash scripts/o2-event.sh deploy_blocked failure "Despliegue a EC2 bloqueado: pruebas fallidas" extra.json
            fi
          fi

  # ---------------- 4. Despliegue a EC2 (solo si TODAS las pruebas pasan) ----------------
  deploy:
    name: Deploy · AWS EC2
    runs-on: ubuntu-latest
    needs: [backend-tests, e2e-tests]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
      - name: Copiar código al servidor
        run: |
          rsync -az --delete \
            --exclude .git --exclude .env --exclude node_modules --exclude .venv \
            -e "ssh -i ~/.ssh/ec2.pem" \
            ./ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/tienda/"
      - name: Actualizar contenedores
        run: |
          ssh -i ~/.ssh/ec2.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "cd ~/tienda && APP_VERSION=${GITHUB_SHA::7} docker compose --profile observability up -d --build --remove-orphans && docker image prune -f"
      - name: Verificar salud
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "http://${{ secrets.EC2_HOST }}/health"; then exit 0; fi
            sleep 5
          done
          echo "La aplicación no respondió /health" && exit 1
      - name: Registrar despliegue en OpenObserve
        if: always()
        run: |
          echo "{\"ec2_host\":\"${{ secrets.EC2_HOST }}\"}" > extra.json
          if [ "${{ job.status }}" = "success" ]; then
            bash scripts/o2-event.sh deploy success "Contenedores actualizados en EC2" extra.json
          else
            bash scripts/o2-event.sh deploy failure "Falló el despliegue en EC2" extra.json
          fi
